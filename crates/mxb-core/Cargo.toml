[package]
name = "mxb-core"
version = "0.1.0"
description = "Public, headless tools for MX Bikes installs and mods."
authors = ["Frost"]
edition = "2021"
license = "MIT"
[lib]
name = "mxb_core"

[dependencies]
anyhow = "1"
log = "0.4"
mxb-content = { path = "../content", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
trash = "5"
dirs-next = "2"

[dev-dependencies]
tempfile = "3"
