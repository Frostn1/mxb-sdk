[package]
name = "mxb-sdk"
version = "0.1.0"
description = "Feature-gated umbrella crate and CLI for MX Bikes developer packages."
edition = "2021"
license = "MIT"
[features]
default = ["core", "game"]
core = ["dep:mxb-core"]
game = ["dep:mxb-game", "dep:tokio"]
extensions = ["dep:mxb-extensions"]
plugins = ["dep:mxb-plugins", "dep:mxb-core"]
mcp = ["dep:mxb-mcp", "dep:tokio"]
full = ["core", "game", "extensions", "plugins", "mcp"]

[dependencies]
mxb-core = { path = "../mxb-core", version = "0.1.0", optional = true }
mxb-game = { path = "../mxb-game", version = "1.1.0", optional = true }
mxb-extensions = { path = "../mxb-extensions", version = "0.1.0", optional = true }
mxb-plugins = { path = "../mxb-plugins", version = "0.1.0", optional = true }
mxb-mcp = { path = "../mxb-mcp", version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"], optional = true }

[[bin]]
name = "mxb"
path = "src/bin/mxb.rs"

[[example]]
name = "list_and_install"
required-features = ["core"]

[[example]]
name = "watch"
required-features = ["game"]
