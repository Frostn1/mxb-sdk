[package]
name = "mxb-mcp"
version = "0.1.0"
description = "Stdio bridge for MXB App's local HTTP MCP endpoint."
edition = "2021"
license = "MIT"
[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[[bin]]
name = "mxb-mcp"
path = "src/bin/mxb-mcp.rs"

