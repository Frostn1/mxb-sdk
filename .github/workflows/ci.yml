name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/leak_check.py
      - run: python3 scripts/boundary_check.py
      - run: python3 scripts/link_check.py

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      # The core on its own must stay free of the async stack.
      - run: cargo build -p mxb-sdk --no-default-features --features core

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: node scripts/gamesdk/codegen.mjs --check
      - run: bun run typecheck
      - run: bun run --cwd packages/mxb-game build
      - run: bun test packages
